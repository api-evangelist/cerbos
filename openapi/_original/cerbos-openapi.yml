openapi: 3.1.0
info:
  title: Cerbos PDP REST API
  description: |
    REST/JSON interface exposed by the Cerbos Policy Decision Point (PDP) for
    authorization decisions and policy administration. Includes CheckResources,
    PlanResources, ServerInfo, OpenID AuthZEN endpoints, and the Admin API for
    policy and schema management. Generated as a best-effort spec from public
    Cerbos documentation; the canonical OpenAPI is served by every PDP at
    /schema/swagger.json.
  version: "0.x"
  contact:
    name: Cerbos
    url: https://docs.cerbos.dev/cerbos/latest/api/index
  license:
    name: Apache 2.0
    url: https://github.com/cerbos/cerbos/blob/main/LICENSE
servers:
  - url: http://localhost:3592
    description: Local Cerbos PDP (default HTTP port).
tags:
  - name: Check
    description: Evaluate authorization decisions.
  - name: Plan
    description: Generate query plans for resource filtering.
  - name: Server
    description: PDP server metadata.
  - name: AuthZEN
    description: OpenID AuthZEN standards-compliant evaluation endpoints.
  - name: Admin Policies
    description: Policy management (Admin API).
  - name: Admin Schemas
    description: JSON schema management (Admin API).
  - name: Admin Audit
    description: Audit and decision log access (Admin API).
  - name: Admin Store
    description: Policy store administration (Admin API).
paths:
  /api/check/resources:
    post:
      tags: [Check]
      summary: Check resources
      description: Evaluate authorization for a principal against one or more resources and actions.
      operationId: checkResources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckResourcesRequest'
      responses:
        '200':
          description: Authorization decisions per resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResourcesResponse'
        '400':
          $ref: '#/components/responses/Error'
  /api/plan/resources:
    post:
      tags: [Plan]
      summary: Plan resources
      description: Returns a query plan describing the conditions under which a principal may perform an action on resources matching a kind.
      operationId: planResources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanResourcesRequest'
      responses:
        '200':
          description: Query plan response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResourcesResponse'
        '400':
          $ref: '#/components/responses/Error'
  /api/server_info:
    get:
      tags: [Server]
      summary: Server information
      description: Returns Cerbos PDP version, commit hash, and build date.
      operationId: serverInfo
      responses:
        '200':
          description: Server metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
  /schema/swagger.json:
    get:
      tags: [Server]
      summary: OpenAPI specification
      description: Returns the OpenAPI/Swagger specification served by the PDP.
      operationId: swaggerSpec
      responses:
        '200':
          description: OpenAPI document.
          content:
            application/json:
              schema:
                type: object
  /.well-known/authzen-configuration:
    get:
      tags: [AuthZEN]
      summary: AuthZEN discovery
      description: OpenID AuthZEN configuration discovery document.
      operationId: authzenConfiguration
      responses:
        '200':
          description: AuthZEN configuration.
          content:
            application/json:
              schema:
                type: object
  /access/v1/evaluation:
    post:
      tags: [AuthZEN]
      summary: AuthZEN single evaluation
      description: Single access evaluation request per OpenID AuthZEN.
      operationId: authzenEvaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthZenEvaluationRequest'
      responses:
        '200':
          description: AuthZEN evaluation decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthZenEvaluationResponse'
  /access/v1/evaluations:
    post:
      tags: [AuthZEN]
      summary: AuthZEN batch evaluations
      description: Batch access evaluations per OpenID AuthZEN.
      operationId: authzenEvaluations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Batch evaluation decisions.
          content:
            application/json:
              schema:
                type: object
  /admin/policy:
    post:
      tags: [Admin Policies]
      summary: Add or update policies
      operationId: adminAddOrUpdatePolicy
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Policy added/updated.
    put:
      tags: [Admin Policies]
      summary: Add or update policies (PUT)
      operationId: adminAddOrUpdatePolicyPut
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Policy added/updated.
    get:
      tags: [Admin Policies]
      summary: Get policy by id
      operationId: adminGetPolicy
      security:
        - basicAuth: []
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
      responses:
        '200':
          description: Policy document(s).
          content:
            application/json:
              schema:
                type: object
  /admin/policies:
    get:
      tags: [Admin Policies]
      summary: List policies
      operationId: adminListPolicies
      security:
        - basicAuth: []
      parameters:
        - in: query
          name: include_disabled
          schema: { type: boolean }
        - in: query
          name: name_regexp
          schema: { type: string }
        - in: query
          name: scope_regexp
          schema: { type: string }
        - in: query
          name: version_regexp
          schema: { type: string }
      responses:
        '200':
          description: List of policy identifiers.
          content:
            application/json:
              schema:
                type: object
  /admin/policies/inspect:
    get:
      tags: [Admin Policies]
      summary: Inspect policies
      operationId: adminInspectPolicies
      security:
        - basicAuth: []
      responses:
        '200':
          description: Inspection result with actions and variables.
          content:
            application/json:
              schema:
                type: object
  /admin/policy/delete:
    post:
      tags: [Admin Policies]
      summary: Delete a policy
      operationId: adminDeletePolicy
      security:
        - basicAuth: []
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Policy deleted.
  /admin/policy/disable:
    post:
      tags: [Admin Policies]
      summary: Disable a policy
      operationId: adminDisablePolicy
      security:
        - basicAuth: []
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Policy disabled.
  /admin/policy/enable:
    post:
      tags: [Admin Policies]
      summary: Enable a policy
      operationId: adminEnablePolicy
      security:
        - basicAuth: []
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Policy enabled.
  /admin/schema:
    post:
      tags: [Admin Schemas]
      summary: Add or update JSON schemas
      operationId: adminAddOrUpdateSchema
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Schema added/updated.
    get:
      tags: [Admin Schemas]
      summary: Get schema by id
      operationId: adminGetSchema
      security:
        - basicAuth: []
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
      responses:
        '200':
          description: Schema document(s).
          content:
            application/json:
              schema:
                type: object
    delete:
      tags: [Admin Schemas]
      summary: Delete schemas
      operationId: adminDeleteSchema
      security:
        - basicAuth: []
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
      responses:
        '200':
          description: Schema deleted.
  /admin/schemas:
    get:
      tags: [Admin Schemas]
      summary: List schemas
      operationId: adminListSchemas
      security:
        - basicAuth: []
      responses:
        '200':
          description: Schema identifiers.
          content:
            application/json:
              schema:
                type: object
  /admin/auditlog/list/{kind}:
    get:
      tags: [Admin Audit]
      summary: List audit log entries
      operationId: adminListAuditLog
      security:
        - basicAuth: []
      parameters:
        - in: path
          name: kind
          required: true
          schema:
            type: string
            enum: [KIND_ACCESS, KIND_DECISION]
        - in: query
          name: tail
          schema: { type: integer }
        - in: query
          name: between.start
          schema: { type: string, format: date-time }
        - in: query
          name: between.end
          schema: { type: string, format: date-time }
        - in: query
          name: since
          schema: { type: string }
        - in: query
          name: lookup
          schema: { type: string }
      responses:
        '200':
          description: Audit log entries.
          content:
            application/json:
              schema:
                type: object
  /admin/store/revisions:
    delete:
      tags: [Admin Store]
      summary: Purge policy revision history
      operationId: adminPurgeStoreRevisions
      security:
        - basicAuth: []
      responses:
        '200':
          description: Revision history purged.
  /admin/store/reload:
    get:
      tags: [Admin Store]
      summary: Reload the policy store
      operationId: adminReloadStore
      security:
        - basicAuth: []
      responses:
        '200':
          description: Reload triggered.
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Basic authentication for the Admin API (default cerbos/cerbosAdmin; override in production).
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Principal:
      type: object
      required: [id, roles]
      properties:
        id: { type: string }
        policyVersion: { type: string }
        scope: { type: string }
        roles:
          type: array
          items: { type: string }
        attr:
          type: object
          additionalProperties: true
    Resource:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string }
        id: { type: string }
        policyVersion: { type: string }
        scope: { type: string }
        attr:
          type: object
          additionalProperties: true
    ResourceEntry:
      type: object
      required: [actions, resource]
      properties:
        actions:
          type: array
          items: { type: string }
        resource:
          $ref: '#/components/schemas/Resource'
    CheckResourcesRequest:
      type: object
      required: [principal, resources]
      properties:
        requestId: { type: string }
        principal:
          $ref: '#/components/schemas/Principal'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/ResourceEntry'
        auxData:
          type: object
        includeMeta: { type: boolean }
    CheckResourcesResponse:
      type: object
      properties:
        requestId: { type: string }
        results:
          type: array
          items:
            type: object
            properties:
              resource:
                type: object
                properties:
                  id: { type: string }
                  kind: { type: string }
                  policyVersion: { type: string }
                  scope: { type: string }
              actions:
                type: object
                additionalProperties:
                  type: string
                  enum: [EFFECT_ALLOW, EFFECT_DENY, EFFECT_NO_MATCH]
              validationErrors:
                type: array
                items: { type: object }
        cerbosCallId: { type: string }
    PlanResourcesRequest:
      type: object
      required: [principal, resource, action]
      properties:
        requestId: { type: string }
        action: { type: string }
        principal:
          $ref: '#/components/schemas/Principal'
        resource:
          type: object
          required: [kind]
          properties:
            kind: { type: string }
            policyVersion: { type: string }
            scope: { type: string }
            attr:
              type: object
        auxData:
          type: object
        includeMeta: { type: boolean }
    PlanResourcesResponse:
      type: object
      properties:
        requestId: { type: string }
        action: { type: string }
        resourceKind: { type: string }
        policyVersion: { type: string }
        filter:
          type: object
          properties:
            kind:
              type: string
              enum: [KIND_ALWAYS_ALLOWED, KIND_ALWAYS_DENIED, KIND_CONDITIONAL]
            condition:
              type: object
        cerbosCallId: { type: string }
    ServerInfo:
      type: object
      properties:
        version: { type: string }
        commit: { type: string }
        buildDate: { type: string }
    AuthZenEvaluationRequest:
      type: object
      properties:
        subject:
          type: object
          properties:
            type: { type: string }
            id: { type: string }
            properties:
              type: object
        resource:
          type: object
          properties:
            type: { type: string }
            id: { type: string }
            properties:
              type: object
        action:
          type: object
          properties:
            name: { type: string }
            properties:
              type: object
        context:
          type: object
    AuthZenEvaluationResponse:
      type: object
      properties:
        decision:
          type: boolean
        context:
          type: object
    Error:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        details:
          type: array
          items: { type: object }
